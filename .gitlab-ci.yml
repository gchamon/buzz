stages:
  - test
  - build
  - security
  - deploy
  - tag

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:|Draft\s)/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

variables:
  BUZZ_VERSION: v2

include:
  - local: .gitlab/ci/gitleaks.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      - when: never
  - component: gitlab.com/gabriel.chamon/ci-components/changelog-check@v2
    inputs:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:00facf17b58b02b725155862c5cd637f688f906bf7eb5b5194647886d8805cf3
      prepare_command: uv sync --group dev
      check_command: uv run python maint-scripts/changelog.py --check
      job_rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: always
        - when: never
  - local: .gitlab/ci/test.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
          - buzz/**/*
          - tests/**/*
          - pyproject.toml
          - uv.lock
          - pyrightconfig.json
          - .htmlhintrc
          - buzz/Dockerfile
          - docker-compose.yml
          - maint-scripts/update_dependency_refs.py
          - .gitlab-ci.yml
          - .gitlab/ci/*.gitlab-ci.yml
      - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      - if: '$CI_COMMIT_BRANCH == "main"'
      - when: never
  - local: .gitlab/ci/image-publish.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
          - buzz/**/*
          - scripts/**/*
          - pyproject.toml
          - uv.lock
          - buzz/Dockerfile
          - .gitlab-ci.yml
          - .gitlab/ci/image-publish.gitlab-ci.yml
          - .gitlab/ci/security.gitlab-ci.yml
      - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      - if: '$CI_COMMIT_BRANCH == "main"'
      - when: never
  - local: .gitlab/ci/security.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
          - buzz/**/*
          - scripts/**/*
          - pyproject.toml
          - uv.lock
          - buzz/Dockerfile
          - .gitlab/ci/image-publish.gitlab-ci.yml
          - .gitlab/ci/security.gitlab-ci.yml
      - if: '$CI_COMMIT_BRANCH == "main"'
      - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      - when: never

default:
  tags:
    - groundstation
