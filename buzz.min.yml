version: 2

provider:
  real_debrid:
    enabled: true
    token: your_rd_token
  torbox:
    enabled: true
    token: ""

media_server:
  kind: jellyfin
  trigger_lib_scan: true
  jellyfin:
    api_key: ""
  # Built-in categories are embedded in code; custom categories live in buzz.yml.
  library_map:
    movies: Movies
    shows: TV Shows
    anime: Anime

categories: {}

subtitles:
  enabled: true
  opensubtitles:
    api_key: ""
    username: ""
    password: ""
  languages:
    - en
  strategy: most-downloaded
  filters:
    hearing_impaired: exclude
    exclude_ai: true
    exclude_machine: true
