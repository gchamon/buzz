# All settings in this file are also editable live from the Buzz web UI.
# You generally don't need to hand-edit this file beyond provider credentials.
version: 2
provider:
  priority:
    - real_debrid
    - torbox
  real_debrid:
    enabled: true
    token: yourtoken
  torbox:
    enabled: true
    token: ""
  # Maximum number of concurrent upstream connections to providers (count).
  # Caps only the setup/opening phase for provider media streams. Active
  # media streams are intentionally not concurrency- or rate-limited here;
  # they cannot safely share metadata/listing throttles used for PROPFIND,
  # GET setup, directory lists, or scans.
  connection_concurrency: 4
  poll_interval_secs: 10
server:
  bind: 0.0.0.0
  port: 9999

# TLS is enabled by default. Relative paths resolve from the process working
# directory, which is /app in the container. Set both paths to "" to opt out.
# These are container paths.
tls:
  cert_path: data/tls/buzz.crt
  key_path: data/tls/buzz.key

# Container path where machine-managed persistent state lives.
state_dir: data
hooks:
  on_library_change: "bash scripts/media_update.sh"
  curator_url: "http://buzz-curator:8400/rebuild"
  # Wait for provider inventory to settle before rebuilds triggered by provider changes.
  # This delay is not applied to manual RESYNC LIB actions from the UI.
  rd_update_delay_secs: 15
compat:
  enable_all_dir: true
  enable_unplayable_dir: true
directories:
  anime:
    patterns:
      - "\\b[a-fA-F0-9]{8}\\b"
  shows: {}
  movies: {}
categories: {}
request_timeout_secs: 30
user_agent: buzz/v2
version_label: buzz/v2
ui:
  # Frontend polling interval in seconds.
  # Set to 0 to disable auto-polling entirely.
  poll_interval_secs: 3

logging:
  verbose: false
  # Maximum number of log entries to keep in the UI log view (count).
  max_entries: 1000

media_server:
  # Which media server Buzz drives. Supported: jellyfin, plex.
  # Plex support is currently UNTESTED; use at your own risk.
  kind: jellyfin
  # When true, Buzz triggers media-server library scans after rebuilds.
  trigger_lib_scan: false
  jellyfin:
    url: http://jellyfin:8096
    api_key: ""
    # Optional. Auto-discovered if empty.
    scan_task_id: ""
  plex:
    # Plex hook is currently untested.
    url: ""
    token: ""
  # Map debrid category directory names to Jellyfin library names.
  # Keys must match the directory names produced by the debrid layer.
  library_map:
    movies: Movies
    shows: TV Shows
    anime: Anime
  # Before triggering Jellyfin scans, Buzz reads a sample of files through the
  # mounted raw library. If the provider is down or returning gateway errors,
  # the scan is skipped so Jellyfin keeps its existing metadata.
  scan_probe:
    enabled: true
    sample_ratio_percent: 10
    min_files: 1
    max_attempts: 3
    read_bytes: 524288
    retry_delay_secs: 10

subtitles:
  enabled: false
  fetch_on_resync: false
  opensubtitles:
    api_key: ""
    username: ""
    password: ""
  languages:
    - en
  strategy: most-downloaded
  filters:
    hearing_impaired: exclude
    exclude_ai: true
    exclude_machine: true
  search_delay_secs: 0.5
  download_delay_secs: 1.0
