background:
  # Pixel dimensions of the generated Gaussian background canvas. [pixels]
  size:
    width: 1600
    height: 1000

  # Optional local image path or URL to sample center colors from. When empty,
  # each center's own `color` is used. When set, colors are sampled by center
  # order from the source's top-left, top-right, and lower regions (extra
  # centers reuse the last sample). [path | URL | ""]
  source: ""

  # Gaussian color centers blended to form the background, as an ordered array.
  # Each center is pinned to the canvas border: its position is where a ray
  # leaving the canvas center (0.5, 0.5) at `polar_delta` degrees first meets an
  # edge. The global `polar_delta` below adds to every center's angle, rotating
  # the whole arrangement around the canvas center.
  centers:
    - color: "#210c24" # Center color, used unless `source` is set. [hex RGB]
      polar_delta:
        225.0 # Ray angle from canvas center, math convention:
        # 0 = +x (right), 90 = down, 180 = left, 270 = up.
        # (Image Y grows downward.) [degrees, 0-360]
      sigma_x: 0.70 # Horizontal spread, fraction of canvas width. [0.0-1.0]
      sigma_y: 0.75 # Vertical spread, fraction of canvas height. [0.0-1.0]
    - color: "#1f0d27"
      polar_delta: 315.0
      sigma_x: 0.70
      sigma_y: 0.75
    - color: "#32c6a4"
      polar_delta: 71.5616
      sigma_x: 0.45
      sigma_y: 0.38

  # Gaussian blur applied to the finished background. [pixels, radius]
  blur_radius: 0.6

  # Global angle offset added to every center's `polar_delta`, rotating the
  # whole arrangement around the canvas center. Same units and algorithm as the
  # per-center angle (a ray from the canvas center, projected onto the border).
  # Examples (effective angle = center angle + this offset):
  #     0 -> no rotation (centers keep their configured angles)
  #    90 -> rotate everything a quarter turn clockwise
  #   180 -> rotate everything half a turn (centers move to the opposite edge)
  #   270 -> rotate everything three-quarters clockwise (== 90 anticlockwise)
  # [degrees]
  polar_delta: 45.0

frame:
  # Hyprland config to read live window-frame styling from (border colors,
  # border_size, rounding, shadow). [path]
  hyprland_config: ~/.config/hypr/hyprland.conf

  # When true, read frame values from `hyprland_config`; when false (or the file
  # is missing), use the `fallback` values below. [boolean]
  use_hyprland_values: true

  # Border gradient mode:
  #   active          -> active_border_start -> active_border_end
  #   active_inverted -> active_border_end   -> active_border_start
  # [enum: active | active_inverted]
  border_gradient: active_inverted

  # Values used when Hyprland config is unavailable or disabled.
  fallback:
    active_border_start: "#ff30c7" # Gradient start color. [hex RGB]
    active_border_end: "#00ff99" # Gradient end color. [hex RGB]
    inactive_border: "#5959b4" # Inactive border color. [hex RGB]
    border_size: 2 # Border thickness. [pixels]
    rounding: 5 # Corner radius. [pixels]
    shadow: "#1a1a1a" # Drop-shadow color. [hex RGB]

  # Minimum horizontal/vertical outer gap around the complete browser frame.
  # Smaller values let the framed UI occupy more of the canvas. [pixels]
  max_width_margin: 20
  max_height_margin: 20

  # Drop-shadow appearance. [alpha: 0-255 | blur radius: pixels | offset: pixels]
  shadow_alpha: 120
  shadow_blur_radius: 14
  shadow_offset_y: 8

  # Mock browser chrome drawn around each captured route. [pixels | CSS colors]
  browser:
    address_origin: localhost:9443 # Prefix shown before /<route>.
    top_bar_height: 48
    top_bar_background: "#11111b"
    top_bar_border: "#1e1e2e"
    top_bar_foreground: "#a6adc8"
    address_background: "#1e1e2e"
    address_border: "#313244"
    address_foreground: "#cdd6f4"
    address_width: 600
    address_height: 32
    address_font_size: 13
    icon_size: 18
    lock_icon_size: 14
    sidebar_icon_size: 20
