# Deterministic UI prop rendering config for maint-scripts/render_ui_props.py.
# Units are noted per field. "Normalized" means a fraction of the relevant
# dimension (0.0-1.0 maps to 0..width or 0..height unless stated otherwise).

# Directory where rendered props, background.png, and manifest.json are written.
# Relative paths resolve against the repository root. [path]
output_dir: docs/assets/ui

# Browser viewport used to capture each route screenshot.
viewport:
  width:
    auto # Capture width. "auto" derives it from the frame margins;
    # otherwise an integer pixel value. [pixels | "auto"]
  height:
    auto # Capture height. "auto" derives it from the background
    # and frame margins; otherwise an integer pixel value. [pixels | "auto"]

# Routes to capture and compose, in order. Each becomes <route>.png. [list of route names]
routes:
  - cache
  - archive
  - logs
  - threads
  - config

