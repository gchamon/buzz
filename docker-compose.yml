services:
  buzz-dav:
    image: registry.gitlab.com/gabriel.chamon/buzz/buzz:${BUZZ_VERSION:-v2}
    container_name: buzz-dav
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    mem_limit: ${BUZZ_DAV_MEMORY_LIMIT:-2g}
    memswap_limit: ${BUZZ_DAV_MEMORY_SWAP_LIMIT:-${BUZZ_DAV_MEMORY_LIMIT:-2g}}
    deploy:
      resources:
        limits:
          memory: ${BUZZ_DAV_MEMORY_LIMIT:-2g}
    environment:
      - UV_CACHE_DIR=/app/cache/uv-buzz
      - TZ=${TZ:-UTC}
      - BUZZ_MOUNT_ROOT=${BUZZ_MOUNT_ROOT:-/mnt/buzz}
    ports:
      - 9999:9999
      - 9443:9443
    volumes:
      - ./data:/app/data
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw
      - ./buzz.yml:/app/buzz.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9999/readyz"]
      interval: 2s
      timeout: 2s
      retries: 100
      start_period: 2s
    networks:
      default:
        aliases:
          - buzz
    command: ["dav"]

  rclone:
    image: rclone/rclone:latest@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    container_name: rclone
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:/data:shared
      - ./rclone.conf:/config/rclone/rclone.conf
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    depends_on:
      buzz-dav:
        condition: service_healthy
    command: "mount buzz: /data --allow-other --allow-non-empty --default-permissions --uid ${PUID:-1000} --gid ${PGID:-1000} --vfs-cache-mode full --vfs-cache-max-size 8G --dir-cache-time 10s --poll-interval 10s --rc --rc-no-auth --rc-addr :5572"
    healthcheck:
      test: ["CMD-SHELL", "ls /data/movies >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  plex:
    profiles: ["plex"]
    image: lscr.io/linuxserver/plex:latest@sha256:8b2996bf9a78615d7490d30241ea75f86c3dcdaf14edb4c329eb912932537e4f
    container_name: plex
    network_mode: host
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=${PLEX_VERSION:-docker} # Plex only
      - PLEX_CLAIM=${PLEX_CLAIM:-} # Plex only
    volumes:
      - ./config/plex:/config
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs:ro
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs:ro
    devices:
      - "/dev/dri:/dev/dri"
    restart: unless-stopped

  buzz-curator:
    image: registry.gitlab.com/gabriel.chamon/buzz/buzz:${BUZZ_VERSION:-v2}
    container_name: buzz-curator
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /app
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      - CURATOR_BIND=0.0.0.0
      - CURATOR_PORT=${CURATOR_PORT:-8400}
      - CURATOR_BUILD_ON_START=${CURATOR_BUILD_ON_START:-true}
      - BUZZ_MOUNT_ROOT=${BUZZ_MOUNT_ROOT:-/mnt/buzz}
      - CURATOR_SOURCE_ROOT=${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw
      - CURATOR_TARGET_ROOT=${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated
      - CURATOR_STATE_DIR=/app/data
      - CURATOR_OVERRIDES=/config/overrides.yml
      - UV_CACHE_DIR=/app/cache/uv-pres
      - UV_PROJECT_ENVIRONMENT=/app/.venv-pres
      - TZ=${TZ:-UTC}
    command: ["curator", "server"]
    volumes:
      - ./presentation/overrides.yml:/config/overrides.yml:ro
      - ./data:/app/data
      - ./buzz.yml:/app/buzz.yml:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/curated
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/raw:ro
      - ${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs:${BUZZ_MOUNT_ROOT:-/mnt/buzz}/subs
    restart: unless-stopped
