[project]
name = "buzz"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=50.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.1",
  "rd-api-py>=0.1.0",
  "typing-extensions>=4.0.0",
  "fastapi>=0.141.1",
  "starlette>=1.3.1,<1.4",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "pyview-web>=0.9.0",
  "watchfiles>=1.1.1",
]

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools]
packages = ["buzz", "buzz.core"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "httpx2>=2.9.1",
  "pillow>=12.3.0",
  "playwright>=1.52.0",
  "pyright>=1.1.408",
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "pytest-memray>=1.8.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
memray = true
hide_memray_summary = true
timeout = 10
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "C90",
]
ignore = ["D100", "D104", "D101", "D102", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12
