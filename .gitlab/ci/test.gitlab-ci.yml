pytest:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:00facf17b58b02b725155862c5cd637f688f906bf7eb5b5194647886d8805cf3
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run pytest --cov=buzz --cov-report=xml --cov-report=term
  rules:
    - when: always
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ruff:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:00facf17b58b02b725155862c5cd637f688f906bf7eb5b5194647886d8805cf3
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run ruff check
  rules:
    - when: always

pyright:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:00facf17b58b02b725155862c5cd637f688f906bf7eb5b5194647886d8805cf3
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run pyright
  rules:
    - when: always

htmlhint:
  stage: test
  image: node:alpine@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
  script:
    - npx --yes htmlhint "buzz/pyview_templates/*.html"
  rules:
    - when: always
  allow_failure: true
