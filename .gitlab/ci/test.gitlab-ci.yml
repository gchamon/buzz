pytest:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:bebc7d6de6dd015a483903461eaedea12805728be6f9a044ca7106a2f7e11ddf
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run pytest --cov=buzz --cov-report=xml --cov-report=term
  rules:
    - when: always
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ruff:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:bebc7d6de6dd015a483903461eaedea12805728be6f9a044ca7106a2f7e11ddf
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run ruff check
  rules:
    - when: always

pyright:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:bebc7d6de6dd015a483903461eaedea12805728be6f9a044ca7106a2f7e11ddf
  script:
    - apt-get update && apt-get install -y libatomic1
    - uv sync --group dev
    - uv run pyright
  rules:
    - when: always

htmlhint:
  stage: test
  image: node:alpine@sha256:a2dc166a387cc6ca1e62d0c8e265e49ca985d6e60abc9fe6e6c3d6ce8e63f606
  script:
    - npx --yes htmlhint "buzz/pyview_templates/*.html"
  rules:
    - when: always
  allow_failure: true
